# Researches and drafts the day's six articles straight into Payload.
#
# Nothing here is committed or pushed, and that is the point. Three things
# were blocking an unattended version of this job:
#
#   - a cloud routine could not reach the web (www.openssh.com did not
#     resolve, www.cisa.gov was refused by the proxy) and could not push
#     (HTTP 403, "Claude doesn't have GitHub access to this repository").
#   - the repository is public, so pushing a day's drafts would publish the
#     article text before the author had published the articles.
#   - the site deploys with the Vercel CLI from the author's own machine, so
#     a cover committed by a robot would never reach production and every
#     drafted article would show a broken image.
#
# An Actions runner fixes the first. Writing to Payload instead of to git
# fixes the second. scripts/attach-covers.ts fixes the third by uploading
# each cover into the media collection, which Payload stores in Vercel Blob
# rather than in the build, and which Articles.coverImage prefers over
# coverImageUrl. So a cover is live the moment the author publishes, with no
# deploy in between.
#
# The only artefact that leaves this job is the research brief, kept as a
# build artefact so the reasoning is readable afterwards.
#
# Deliberately manual. The schedule line below is written out and commented;
# 03:30 UTC is 09:00 Asia/Kolkata. Turning it on is a spending decision, not
# a technical one, and should follow a manual run somebody actually read.
name: Daily research and drafting

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to run the research with"
        required: false
        default: "claude-opus-5-5"
        type: string
  schedule:
    # TEMPORARY, for a first unattended run on 7 November: 08:45 UTC is
    # 14:15 Asia/Kolkata. GitHub runs a scheduled workflow only from the
    # default branch, which is currently this one, so this fires without
    # anyone pressing anything. Scheduled runs are commonly late by five to
    # twenty minutes and are occasionally dropped entirely on free runners,
    # so treat the time as approximate.
    #
    # Once a run has gone green, change this to the agreed daily slot:
    #   - cron: "30 3 * * *"    # 09:00 Asia/Kolkata
    - cron: "45 8 * * *"

concurrency:
  # Two runs on the same day would pick the same stories and collide on the
  # next batch number.
  group: daily-research
  cancel-in-progress: false

permissions:
  # Read only. This job writes to the database, never to the repository.
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    # Six articles with primary sources read and six covers captured is a
    # long job. The cap is here so a wedged run cannot burn the month.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Check Chrome is present
        run: google-chrome --version

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Two ways to authenticate, and the cheaper one is first. A token from
      # "claude setup-token" bills against the author's Claude subscription;
      # ANTHROPIC_API_KEY bills per token against the API account. Six
      # articles a day on Opus is a lot of tokens, so the subscription route
      # is the one to prefer. Either secret on its own is enough.
      - name: Research and draft
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # An unset secret arrives as an empty string rather than as nothing,
          # and the CLI treats an empty credential as a bad credential instead
          # of as an absent one. Drop whichever is empty so the other is used.
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset CLAUDE_CODE_OAUTH_TOKEN; fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then unset ANTHROPIC_API_KEY; fi
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}${ANTHROPIC_API_KEY:-}" ]; then
            echo "Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set."
            echo "Add one under Settings, Secrets and variables, Actions."
            echo "The first is produced by running 'claude setup-token' and"
            echo "bills against a Claude subscription rather than per token."
            exit 1
          fi
          # No "|| true" here. If the agent cannot run, this step should be
          # red, rather than green with an empty report and a confusing
          # failure two steps later.
          set -o pipefail
          claude -p "$(cat .github/daily-research-prompt.md)" \
            --model "${{ inputs.model || 'claude-sonnet-5-5' }}" \
            --dangerously-skip-permissions \
            --output-format text 2>&1 | tee agent-report.txt

      - name: Show what it wrote
        run: git status --porcelain

      - name: Insert the drafts into Payload
        id: insert
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          new=$(git ls-files --others --exclude-standard 'scripts/draft-long-*.ts')
          if [ -z "$new" ]; then
            echo "The agent wrote no draft scripts. Nothing to insert."
            exit 1
          fi
          echo "scripts<<EOF" >> "$GITHUB_OUTPUT"
          echo "$new" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          for f in $new; do
            echo "::group::insert $f"
            npx tsx "$f"
            echo "::endgroup::"
          done

      - name: Upload the covers into Payload
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          for f in ${{ steps.insert.outputs.scripts }}; do
            echo "::group::covers $f"
            npx tsx scripts/attach-covers.ts "$f"
            echo "::endgroup::"
          done

      - name: Keep the brief and the agent's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-brief
          path: |
            research-brief-*.md
            agent-report.txt
          if-no-files-found: warn
          retention-days: 30
