# Generation runs here, not on Vercel: a research run takes minutes (measured
# at 138s and 364s), and Vercel's Hobby plan caps a function at 60s. GitHub
# Actions allows up to 6 hours, so the script runs directly and writes to Neon.
# The newsletter digest stays on Vercel Cron — it finishes in seconds.
name: Generate article drafts

on:
  # Manual only — publishing is a hand process for now. A cron here would pile
  # up runs nobody asked for, and each run costs roughly $0.30-0.60 in API
  # usage (see lib/article-generator.ts).
  #
  # To draft one article, run this workflow from the Actions tab. To put it
  # back on a schedule, restore:
  #   schedule:
  #     - cron: "0 */4 * * *"   # every 4 hours = 6/day
  workflow_dispatch: {}

concurrency:
  # Two runs researching at once would likely land on the same story.
  group: generate-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # A clean run is 90-200s, but retries stack: one observed run that hit two
    # ECONNRESETs took 971s. 30 leaves headroom without letting a wedged run
    # burn Actions minutes indefinitely.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Research and draft one article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: npx tsx scripts/generate-article.ts
